%YAML:1.0
cameras:
    # Stereo Left (cam 0)
  - {T_SC: [-0.0698713321300669, 0.9974311366279659, -0.01578368244147882, 0.09591541035356203,
           -0.4012010767504094, -0.013611320180793519, 0.9158888731594284, 0.0031652210880806914 ,
           0.9133212430249729, 0.07032680604136293, 0.4011214870726056, -0.17347583481498788,
            0.0  , 0.0, 0.0  , 1.0] ,
     image_dimension: [640, 360],
     distortion_type: equidistant,
     distortion_coefficients: [-0.04126471506095073, 0.017216956599962936, -0.018057684204018695, 0.00630994375090921],
     focal_length: [363.6290575969351, 363.4569976148472],
     principal_point: [317.9245174633069, 184.8406997322444],
     cam_model: pinhole,
     camera_type: gray+depth,
     mapping: true,
     mapping_rectification: false,
     slam_use: okvis}
     

     # Stereo Right (cam 1)
  - {T_SC: [0.06510398530319374, 0.9968817380463926, 0.04459003753357166, -0.12262190108592472,
            -0.40681366572732025, -0.014287876787808563, 0.9133994186304242, 0.0053441089148674485,
           0.911188296937105, -0.07760577895041193, 0.4046149164308677, -0.17165155112401526,
            0.0  , 0.0, 0.0  , 1.0] ,
     image_dimension: [640, 360],
     distortion_coefficients: [-0.025438010943880734, -0.051255606701870494, 0.11302111616724388, -0.07725148209222381],
     distortion_type: equidistant,
     focal_length: [362.65329983042756, 362.4475060023373],
     principal_point: [332.317090318173, 185.0127716583754],
     cam_model: pinhole,
     camera_type: gray, #gray, rgb, gray+depth, rgb+depth 
     mapping: true,
     mapping_rectification: false,
     slam_use: okvis} #none, okvis, okvis-depth, okvis-virtual
          
camera_parameters:
    timestamp_tolerance: 0.005 # [s] stereo frame out-of-sync tolerance
    sync_cameras: [0, 1] # the cameras that will be synchronised
    image_delay: 0.0 # [s] timestamp_camera_correct = timestamp_camera - image_delay
    online_calibration: # some parameters to set the online
        do_extrinsics: false  # Simulator has known extrinsics
        do_extrinsics_final_ba: false
        sigma_r: 0.01 # T_SCi position prior stdev [m]
        sigma_alpha: 0.1 # T_SCi orientation prior stdev [rad]
        sigma_r_final_ba: 0.03 # T_SCi position prior stdev in final BA [m]
        sigma_alpha_final_ba: 0.3 # T_SCi orientation prior stdev in final BA [rad]
    deep_stereo_indices: [0,1] # [left, right] camera indices for the stereo network
    fov_scale: 1.0 # Divisor for new focal length which is only used when fisheye stereo rectification for dense mapping.


imu_parameters:
    use: true
    a_max: 176.0 # acceleration saturation [m/s^2] (PX4 default)
    g_max: 7.8 # gyro saturation [rad/s] (PX4 default)
    sigma_g_c: 6.447192398374904e-02
    sigma_a_c: 0.1041716817202322     # accelerometer noise density [m/s^2/sqrt(Hz)]
    sigma_bg: 4.027e-02  # gyro bias prior [rad/s]
    sigma_ba: 4.827e-01 # accelerometer bias prior [m/s^2]
    sigma_gw_c: 5.4968240967256775e-04 # gyro drift noise density [rad/s^s/sqrt(Hz)]
    sigma_aw_c: 3.5309908618458486e-2 # accelerometer drift noise density [m/s^2/sqrt(Hz)]
    g: 9.81007 # Earth's acceleration due to gravity [m/s^2]
    g0: [0.0, 0.0, 0.0] # initial gyroscope bias [rad/s]
    a0: [0.0, 0.0, 0.0] # initial accelerometer bias [m/s^2]
    s_a: [1.0,1.0,1.0]

    T_BS:
        [1.0000, 0.0000, 0.0000, 0.0000,
         0.0000, 1.0000, 0.0000, 0.0000,
         0.0000, 0.0000, 1.0000, 0.0000,
         0.0000, 0.0000, 0.0000, 1.0000]


# frontend: detection etc.
frontend_parameters:
    detection_threshold: 38.0 # detection threshold. By default the uniformity radius in pixels
    absolute_threshold: 150.0 # absolute Harris corner threshold (noise floor)
    matching_threshold: 60.0 # BRISK descriptor matching threshold
    octaves: 0 # number of octaves for detection. 0 means single-scale at highest resolution
    max_num_keypoints: 700 # restrict to a maximum of this many keypoints per image (strongest ones)
    keyframe_overlap: 0.60 # minimum field-of-view overlap
    use_cnn: false # use the CNN (if available) to filter out dynamic content / sky
    parallelise_detection: true # Run parallel detect & describe.
    num_matching_threads: 4 # Parallelise matching with this number of threads.


# estimator parameters
estimator_parameters:
    num_keyframes: 5 # number of keyframes in optimisation window
    num_loop_closure_frames: 3 # number of loop closure frames in optimisation window
    num_imu_frames: 3 # number of frames linked by most recent nonlinear IMU error terms
    do_loop_closures: false # whether to do VI-SLAM or VIO
    do_final_ba: true # Whether to run a full final BA
    enforce_realtime: true # whether to limit the time budget for optimisation
    realtime_min_iterations: 3 # minimum number of iterations always performed
    realtime_max_iterations: 10 # never do more than these, even if not converged
    realtime_time_limit: 0.035 # time budget for realtime optimisation [s]
    realtime_num_threads: 3 # number of threads for the realtime optimisation
    full_graph_iterations: 15 # don't do more than these for the full (background) optimisation
    full_graph_num_threads: 3 # number of threads for the full (background) optimisation
    p_dbow: 0.35 # Match threshold for dBoW -- unfortunately this varies with setups.
    drift_percentage_heuristic: 2.5 # % allowed drift in loop closures rel. to dist. travelled.

# some options for how and what to output
output_parameters:
    display_topview: true # Displays top view of the trajectory. Might become slow for long sequences.
    display_matches: true  # displays debug video and matches. May be slow.
    display_overhead: false # debug overhead image. Is slow.
    enable_submapping: true # Enable volumetric submapping
