cameras:
  - {T_SC: [ 0.01746543, -0.99967355,  0.01864809,  0.10429535,
             0.99984742,  0.0174568,  -0.00062582,  0.01255696,
             0.00030008,  0.01865617,  0.99982591,  0.12393655,
             0.        ,  0.        ,  0.        ,  1.        ],
              
     image_dimension: [640, 360],
     distortion_type: equidistant,
     distortion_coefficients: [-0.04462095705802275, 0.007418549390912399, -0.021204230103761237, 0.013607617791950362],
     focal_length: [368.25139209478283, 368.53390651481163],
     principal_point: [325.31075156007597, 192.6007747125362],
     cam_model: pinhole, 
     camera_type: gray, 
     mapping: true,
     mapping_rectification: false,
     slam_use: okvis} # Frontal camera (cam 0)
     
 # - {T_SC: [ 0.0042722 ,  0.99966265, 0.02561904, 0.1069516,
 #           -0.99999013,  0.00423947, 0.0013319 , 0.00996484,
 #            0.00122284, -0.02562447, 0.99967089, 0.14696062,
 #            0.0       ,  0.0       , 0.0       , 1.0],
              
 #    image_dimension: [640, 360],
 #    distortion_type: equidistant,
 #    distortion_coefficients: [-0.33231602038161695, 0.10510617794570679, 0.0006022317675045097, -0.00013022840773209947],
 #    focal_length: [358.78616317352174, 358.87095356896367],
 #    principal_point: [325.59992158061465, 190.91525175670728],
 #    cam_model: pinhole, 
 #    camera_type: gray, 
 #    mapping: true,
 #    mapping_rectification: false,
 #    slam_use: okvis} # Down-looking camera (cam 1)
          
camera_parameters:
    timestamp_tolerance: 0.005 # KEEP: 5ms is standard, but MUN-FRL is hardware-synced, so this is safe.
    sync_cameras: [0]          # CHANGE: Use [0] if running Monocular (as MUN-FRL provides front/down mono streams).
    image_delay: 0.0           # KEEP: Start at 0.0. MUN-FRL claims hardware alignment.
    # 2. ONLINE CALIBRATION
    online_calibration: 
        # CHANGE to true if you experience drift. 
        # The Bell412 platform has high vibration which can shift extrinsics slightly.
        do_extrinsics: false 
        do_extrinsics_final_ba: false 
        # PRIORS (Keep these for stability)
        sigma_r: 0.01 
        sigma_alpha: 0.1 
        sigma_r_final_ba: 0.03 
        sigma_alpha_final_ba: 0.3 
    # 3. OTHER
    #deep_stereo_indices: [0, 1] # IGNORE if using Monocular.
    fov_scale: 1.0              # KEEP: This is for dense mapping rectification.

